name: Prosper AI
description: >-
  Prosper AI is an AI-native voice automation platform for healthcare operations,
  founded in 2023 and backed by Andreessen Horowitz (a16z), Emergence Capital,
  Base10, Company Ventures and Y Combinator. Prosper runs the voice-heavy work of
  clinic and revenue-cycle operations end-to-end: answering and placing patient
  phone calls, appointment scheduling directly into the EHR, insurance eligibility
  and benefits verification, prior authorization, and patient billing follow-up.
  The platform integrates with 80+ EHR, practice-management and clearinghouse
  systems (Epic, athenahealth, Cerner, MEDITECH, NextGen, Nextech, Allscripts/Altera,
  Availity, Healthie). Prosper exposes a public REST API (Prosper Voice, /api/v1)
  for driving campaigns, targets, live calls and call-log export, plus a hosted,
  OAuth-protected Model Context Protocol (MCP) server for agent access. Prosper is
  HIPAA compliant and SOC 2 Type II attested and signs Business Associate Agreements.
